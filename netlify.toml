# Application monopage : toute autre URL est servie par la coquille neutre
# (les pages publiques ont leur propre fichier pré-rendu : dist/<page>/index.html)
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# -----------------------------------------------------------------------------
# En-têtes
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Supabase (API + temps réel), météo du tableau de bord, Google Ads (chargé
    # uniquement après consentement). 'wasm-unsafe-eval' : base de démonstration.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://www.google.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.googletagmanager.com; img-src 'self' data: blob: https://*.supabase.co https://www.google.com https://www.google.fr https://googleads.g.doubleclick.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src https://td.doubleclick.net https://www.googletagmanager.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Fichiers versionnés par Vite : mis en cache un an
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Pages HTML : toujours revalidées (nouveau déploiement visible immédiatement)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Espace dirigeant et pages privées : jamais indexés
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mon-compte"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reservation/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
