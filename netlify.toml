# =============================================================================
# Karting Roussillon — déploiement Netlify
# Variables d'environnement à définir dans Netlify (Site settings → Environment) :
#   VITE_SITE_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
#   VITE_GOOGLE_ADS_ID, VITE_GOOGLE_ADS_BOOKING_LABEL, VITE_GOOGLE_ADS_GIFT_LABEL
# Voir DEPLOIEMENT.md.
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

